name: Publish AgriRegistry Desktop Update

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-windows-update:
    name: Build and publish Windows update
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"

          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match package version $version."
          }

      - name: Build Windows updater files
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --publish never

      - name: Verify update files
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "dist-electron" `
            -Filter "AgriRegistry-Setup-*.exe" `
            -File |
            Select-Object -First 1

          $blockmap = Get-ChildItem `
            "dist-electron" `
            -Filter "AgriRegistry-Setup-*.exe.blockmap" `
            -File |
            Select-Object -First 1

          $latest = Get-Item `
            "dist-electron/latest.yml" `
            -ErrorAction SilentlyContinue

          if (-not $installer) {
            throw "The NSIS installer was not generated."
          }

          if (-not $blockmap) {
            throw "The installer blockmap was not generated."
          }

          if (-not $latest) {
            throw "latest.yml was not generated."
          }

      - name: Publish production GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"

          $assets = @(
            Get-ChildItem `
              "dist-electron" `
              -Filter "AgriRegistry-Setup-*.exe" `
              -File |
              Select-Object -ExpandProperty FullName

            Get-ChildItem `
              "dist-electron" `
              -Filter "AgriRegistry-Setup-*.exe.blockmap" `
              -File |
              Select-Object -ExpandProperty FullName

            (Resolve-Path "dist-electron/latest.yml").Path
          )

          gh release create $tag @assets `
            --repo "${{ github.repository }}" `
            --title "AgriRegistry $version" `
            --generate-notes `
            --latest
