<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Opening AgriRegistry</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: #0f4e2b;
      background:
        radial-gradient(circle at 10% 10%, rgba(76, 174, 82, .42), transparent 31%),
        radial-gradient(circle at 88% 14%, rgba(255,255,255,.98), transparent 35%),
        radial-gradient(circle at 76% 88%, rgba(73, 165, 99, .3), transparent 38%),
        linear-gradient(135deg, #cce8c4 0%, #fbfff9 45%, #ffffff 57%, #d4edd5 100%);
      font-family: "Segoe UI", Inter, Arial, sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .5;
      background-image:
        radial-gradient(circle, rgba(32,117,59,.65) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.95) 0 1.5px, transparent 2.5px);
      background-size: 78px 78px, 121px 121px;
      animation: drift 9s linear infinite;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(920px, 94vw);
      display: grid;
      justify-items: center;
      gap: clamp(14px, 2.5vh, 24px);
      text-align: center;
      animation: arrive .75s cubic-bezier(.18,.88,.25,1.08) both;
    }

    .logo-panel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vw, 42px);
      padding: clamp(24px, 5vw, 58px);
      border: 1px solid rgba(255,255,255,.98);
      border-radius: clamp(26px, 4vw, 44px);
      background:
        radial-gradient(circle at 16% 12%, rgba(193,235,181,.62), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,.99), rgba(232,247,228,.97));
      box-shadow:
        0 34px 100px rgba(25,91,46,.2),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    .emblem {
      width: clamp(140px, 21vw, 240px);
      height: clamp(140px, 21vw, 240px);
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(17,83,40,.25));
      animation: breathe 1.5s ease-in-out infinite alternate;
    }

    .copy {
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 9px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #075a2e;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 950;
      line-height: .9;
      letter-spacing: -.055em;
      text-align: center;
      text-shadow:
        0 2px 0 #fff,
        0 12px 30px rgba(13,82,42,.22);
    }

    .powered {
      margin: 0;
      color: #a85d0d;
      font-size: clamp(.9rem, 2vw, 1.25rem);
      font-weight: 900;
      text-align: center;
    }

    .powered span { color: #16833b; }

    .loading {
      margin: 0;
      color: #155c33;
      font-size: clamp(.82rem, 1.8vw, 1.05rem);
      font-weight: 950;
      letter-spacing: .2em;
      text-align: center;
      text-transform: uppercase;
    }

    .progress {
      width: min(420px, 74vw);
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(26,101,53,.14);
    }

    .progress::after {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2c9b50, #a7e768, #38aa78);
      transform-origin: left;
      animation: progress 1.8s cubic-bezier(.2,.75,.26,1) both;
    }

    @media (max-width: 700px) {
      .logo-panel {
        flex-direction: column;
        gap: 8px;
      }

      .emblem {
        width: clamp(118px, 36vw, 180px);
        height: clamp(118px, 36vw, 180px);
      }

      h1 {
        font-size: clamp(2.6rem, 14vw, 4.8rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .particles,
      .card,
      .emblem,
      .progress::after {
        animation: none !important;
      }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(28px) scale(.94); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes breathe {
      from { transform: scale(.99); }
      to { transform: scale(1.02); }
    }

    @keyframes progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-78px); }
    }
  </style>
</head>
<body>
  <div class="particles"></div>
  <main class="card">
    <section class="logo-panel">
      <img class="emblem" src="./assets/agriregistry-icon.png" alt="">
      <div class="copy">
        <h1>AgriRegistry</h1>
        <p class="powered">Powered by <span>Luntian</span></p>
      </div>
    </section>
    <p class="loading">Opening the registry</p>
    <div class="progress" aria-hidden="true"></div>
  </main>
</body>
</html>
