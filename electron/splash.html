<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening AgriRegistry</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 34px;
      background:
        radial-gradient(circle at 18% 18%, rgba(123,220,72,.25), transparent 33%),
        radial-gradient(circle at 82% 78%, rgba(67,176,116,.22), transparent 34%),
        linear-gradient(145deg,#03120c,#0a2d1d 52%,#06170f);
      box-shadow: 0 34px 90px rgba(0,0,0,.5);
      animation: shell-in .7s cubic-bezier(.18,.88,.25,1.1) both;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      display: grid;
      justify-items: center;
      gap: 15px;
    }

    .logo-panel {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: 28px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.99),rgba(235,247,230,.97));
      box-shadow:
        0 26px 74px rgba(0,0,0,.34),
        0 0 56px rgba(122,219,76,.17),
        inset 0 1px rgba(255,255,255,1);
    }

    .logo-panel::after {
      content: "";
      position: absolute;
      top: -70%;
      left: -28%;
      width: 24%;
      height: 240%;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.92),transparent);
      transform: rotate(18deg);
      animation: shine 1.65s .22s ease both;
    }

    img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      filter:
        contrast(1.3)
        brightness(1.08)
        saturate(1.1)
        drop-shadow(0 2px 0 white)
        drop-shadow(0 9px 20px rgba(14,70,39,.27));
      animation: logo-breathe 1.45s ease-in-out infinite alternate;
    }

    p {
      margin: 0;
      color: rgba(240,252,243,.97);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .19em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(0,0,0,.58);
    }

    p span { color: #cbf56d; }

    .progress {
      width: 260px;
      max-width: 68%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
    }

    .progress::after {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg,#75d74c,#edf88d,#55c993);
      transform-origin: left;
      animation: progress 1.8s cubic-bezier(.2,.75,.26,1) both;
    }

    .particles,
    .particles::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: .7;
      background-image:
        radial-gradient(circle,rgba(219,255,151,.92) 0 1px,transparent 2px),
        radial-gradient(circle,rgba(111,219,103,.75) 0 1.5px,transparent 2.5px);
      background-size: 68px 68px,107px 107px;
      background-position: 13px 17px,38px 49px;
      animation: drift 7s linear infinite;
    }

    @keyframes shell-in {
      from { opacity: 0; transform: scale(.9); filter: blur(8px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes shine {
      from { transform: translateX(0) rotate(18deg); opacity: 0; }
      25% { opacity: .88; }
      to { transform: translateX(610%) rotate(18deg); opacity: 0; }
    }

    @keyframes logo-breathe {
      from { transform: scale(.992); }
      to { transform: scale(1.012); }
    }

    @keyframes progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-68px); }
    }
  </style>
</head>
<body>
  <main class="splash">
    <div class="particles"></div>
    <section class="card">
      <div class="logo-panel">
        <img src="./assets/agriregistry-logo.png" alt="AgriSpecimen Registry">
      </div>
      <p>Microbes <span>&bull;</span> isolates <span>&bull;</span> invertebrates</p>
      <div class="progress" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
